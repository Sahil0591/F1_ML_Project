[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-ml-predictor"
version = "0.1.0"
description = "Point-in-time Formula 1 race and championship prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pyarrow>=17,<27",
    "scikit-learn>=1.8,<2",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1", "mypy>=1.15,<2"]
fastf1 = ["fastf1>=3.5,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "threadpoolctl", "threadpoolctl.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
